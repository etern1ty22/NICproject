name: aco_demo_c101_mini
output_dir: output/demo/aco_demo
output_basename: demo
objective_mode: hierarchical
seed_set:
  - 42
evaluator:
  name: default_evaluator
solver:
  name: aco_solver
  params:
    n_ants: 20
    n_iterations: 50
    alpha: 1.0
    beta: 2.0
    rho: 0.1
    q_const: 100.0
    vehicle_penalty: 10.0
    enable_local_search: true
    local_search_operators:
      - relocate
      - swap
      - two_opt
    local_search_max_passes: 1
    max_workers: 1
datasets:
  - id: solomon_c101_mini_demo
    path: data/fixtures/solomon/C101-mini.txt
    format: solomon
    role: demo
metadata:
  purpose: final_live_demo
  reliability_rationale: committed_fixture_and_single_worker_for_predictable_runtime
